site_name: Salon De Nature 운영 매뉴얼
site_description: Salon De Nature 예약 관리 시스템 원장님용 운영 설명서
site_author: Salon De Nature
copyright: Copyright &copy; Salon De Nature

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - 홈: index.md
  - 관리자 대시보드: admin/dashboard.md
  - 시작하기:
      - 시스템 소개와 로그인: getting-started/index.md
  - 예약 관리:
      - 예약 캘린더: booking/calendar.md
      - 예약 상세와 상태 처리: booking/detail-status.md
      - 타임라인: booking/timeline.md
  - 고객 관리:
      - 고객 CRM: customers/crm.md
  - 직원·서비스:
      - 서비스 관리: operations/services.md
      - 직원 관리: operations/staff.md
      - 직원 근무 일정·휴무: operations/staff-schedule.md
      - 직원 담당 서비스: operations/staff-services.md
  - 매출 분석:
      - 매출 및 운영 분석: analytics/revenue.md
  - 설정·문자:
      - 샵 설정: settings/shop.md
      - 알림센터: settings/notifications.md
      - 문자 템플릿: settings/sms.md
      - 관리자 계정: settings/accounts.md
  - 사용자 화면:
      - 고객 화면: users/customer.md
      - 직원 화면: users/staff.md
  - 운영 가이드:
      - 하루 운영 절차: guide/daily-workflow.md
      - 상황별 처리: guide/scenarios.md
      - 문제 해결: guide/troubleshooting.md
      - 운영 체크리스트: guide/checklists.md
